<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Vibra Tu Radio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
      margin: 0;
      padding: 30px 15px;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #ffc400;
    }

    .panel {
      background: #121212;
      border: 1px solid #5b147f;
      border-radius: 15px;
      padding: 25px;
      margin-top: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #ffc400;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #222;
      color: white;
      box-sizing: border-box;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 13px 22px;
      border: none;
      border-radius: 8px;
      background: #ff7a00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffc400;
    }

    #mensaje {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .volver {
      display: inline-block;
      margin-top: 20px;
      color: #ffc400;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Vibra Tu Radio - Administración</h1>

    <div class="panel">

      <h2>Agregar noticia</h2>

      <label for="titulo">Título</label>
      <input id="titulo" type="text" placeholder="Título de la noticia">

      <label for="categoria">Categoría</label>
      <input id="categoria" type="text" placeholder="Ejemplo: Actualidad">

      <label for="imagen">Imagen</label>
      <input id="imagen" type="text" placeholder="URL de la imagen">

      <label for="fecha">Fecha</label>
      <input id="fecha" type="date">

      <label for="resumen">Resumen</label>
      <textarea id="resumen" placeholder="Escribe el resumen de la noticia"></textarea>

      <button onclick="guardarNoticia()">
        Guardar noticia
      </button>

      <div id="mensaje"></div>
<h2 style="margin-top:35px;">Noticias publicadas</h2>

      <div id="lista-noticias">
        Cargando noticias...
      </div>
    </div>

    <a class="volver" href="/">
      ← Volver a Vibra Tu Radio
    </a>

  </div>

  <script>

    async function guardarNoticia() {

      const noticia = {
        id: window.noticiaEditando || null,
        titulo: document.getElementById("titulo").value,
        categoria: document.getElementById("categoria").value,
        imagen: document.getElementById("imagen").value,
        fecha: document.getElementById("fecha").value,
        resumen: document.getElementById("resumen").value
      };

      const mensaje = document.getElementById("mensaje");

      if (!noticia.titulo || !noticia.resumen) {

        mensaje.style.display = "block";
        mensaje.textContent = "Debes escribir al menos el título y el resumen.";
        return;

      }

      try {

        const respuesta = await fetch("/api/noticias", {
  method: window.noticiaEditando ? "PUT" : "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(noticia)
        });

        const resultado = await respuesta.json();

        mensaje.style.display = "block";
        mensaje.textContent = resultado.mensaje || "Solicitud enviada.";
if (window.noticiaEditando) {
  window.noticiaEditando = null;
  document.querySelector(
    'button[onclick="guardarNoticia()"]'
  ).textContent = "Guardar noticia";
}
      } catch (error) {

        console.error(error);

        mensaje.style.display = "block";
        mensaje.textContent =
          "No se pudo conectar con el servidor.";

      }

    }
 async function cargarNoticiasAdmin() {

      const lista = document.getElementById("lista-noticias");

      try {

        const respuesta = await fetch("/api/noticias");

        if (!respuesta.ok) {
          throw new Error("No se pudieron cargar las noticias");
        }

        const noticias = await respuesta.json();

        lista.innerHTML = "";

        if (!noticias || noticias.length === 0) {
          lista.innerHTML = "<p>No hay noticias publicadas.</p>";
          return;
        }

        noticias.forEach(noticia => {

          const item = document.createElement("div");

          item.style.border = "1px solid #555";
          item.style.borderRadius = "10px";
          item.style.padding = "15px";
          item.style.marginTop = "15px";

          item.innerHTML = `
            <strong>${noticia.titulo || ""}</strong>
            <br>
            <small>${noticia.fecha || ""}</small>
            <br>
            <button type="button" onclick="editarNoticia(${noticia.id})">
              ✏️ Editar
            </button>
          `;

          lista.appendChild(item);

        });

      } catch (error) {

        console.error(error);
        lista.innerHTML = "<p>No fue posible cargar las noticias.</p>";

      }

    }

    cargarNoticiasAdmin();
    async function editarNoticia(id) {

  try {

    const respuesta = await fetch("/api/noticias");

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las noticias");
    }

    const noticias = await respuesta.json();

    const noticia = noticias.find(n => n.id === id);

    if (!noticia) {
      alert("No se encontró la noticia.");
      return;
    }

    document.getElementById("titulo").value = noticia.titulo || "";
    document.getElementById("imagen").value = noticia.imagen || "";
    document.getElementById("fecha").value = noticia.fecha || "";
    document.getElementById("resumen").value =
      noticia.contenido || noticia.resumen || "";

    window.noticiaEditando = id;

    document.querySelector(
      'button[onclick="guardarNoticia()"]'
    ).textContent = "Actualizar noticia";

  } catch (error) {

    console.error(error);
    alert("No se pudo cargar la noticia para editar.");

  }

}
  </script>

</body>
</html>
